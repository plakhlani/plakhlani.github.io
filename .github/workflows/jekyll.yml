name: Jekyll site CI

on:
  push:
    branches: [ feature/gh-pages ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build the site
        run: bundle exec jekyll build --future
        env:
          JEKYLL_ENV: production
